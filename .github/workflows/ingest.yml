name: Ingesta diaria

on:
  schedule:
    # 04:45 UTC = 05:45 en Madrid en invierno (06:45 en verano).
    # El mercado se actualiza entre las 04:00 y las 05:30.
    - cron: "45 4 * * *"
    # 15:30 UTC = 16:30 en Madrid: onces y nota frescos antes del plan de las 18:00
    - cron: "30 15 * * *"
    # Días de partido (vie-lun): onces y nota cada 3 h para el aviso de última hora (solo onces + nota)
    - cron: "15 10,13,16,19 * * 5,6,0,1"
  workflow_dispatch:
    inputs:
      modo:
        description: "completa (ingesta, onces y nota) u onces (solo onces y nota)"
        default: "completa"

jobs:
  ingest:
    # Con el disparador externo activado (variable CRON_EXTERNO = 1), las pasadas programadas no hacen nada
    if: github.event_name != 'schedule' || vars.CRON_EXTERNO != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        if: github.event.schedule != '15 10,13,16,19 * * 5,6,0,1' && github.event.inputs.modo != 'onces'
      - run: npm run ingest
        if: github.event.schedule != '30 15 * * *' && github.event.schedule != '15 10,13,16,19 * * 5,6,0,1' && github.event.inputs.modo != 'onces'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Si las dos fuentes de onces fallan, la nota se calcula igual (solo con minutos)
      - run: npm run onces
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: npm run score
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

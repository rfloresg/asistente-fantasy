name: App Android

# Fabrica la app de Android (el .apk que se descarga desde /app) y la deja en public/app/ para que la web
# la sirva. La app abre la web a pantalla completa, así que solo hace falta repetirlo si cambia algo de
# movil/ (icono, nombre, permisos). Se lanza a mano desde la pestaña Actions o al cambiar movil/.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["movil/**", ".github/workflows/android.yml"]

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Comprobar la llave de firma
        id: llave
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::warning::Aún no hay llave de firma (ANDROID_KEYSTORE_B64 y ANDROID_KEYSTORE_PASSWORD): mira movil/README.md. No se fabrica la app."
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/fantasy.jks"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - run: npm ci
        if: steps.llave.outputs.ok == 'true'
        working-directory: movil
      - run: npx cap sync android
        if: steps.llave.outputs.ok == 'true'
        working-directory: movil
      - name: Configuración de Firebase (avisos)
        if: steps.llave.outputs.ok == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::warning::Sin GOOGLE_SERVICES_JSON: la app sale sin avisos (mira movil/README.md)"
          elif echo "$GOOGLE_SERVICES_JSON" | head -c 1 | grep -q '{'; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > movil/android/app/google-services.json
          else
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > movil/android/app/google-services.json
          fi
      - name: Fabricar el .apk firmado
        if: steps.llave.outputs.ok == 'true'
        working-directory: movil/android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/fantasy.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Dejarlo en la web
        if: steps.llave.outputs.ok == 'true'
        run: |
          mkdir -p public/app
          cp movil/android/app/build/outputs/apk/release/app-release.apk public/app/asistente-fantasy.apk
          printf '{"version":"1.%s","fecha":"%s"}\n' "${{ github.run_number }}" "$(date -u +%Y-%m-%dT%H:%MZ)" > public/app/version.json
          rm -f "$RUNNER_TEMP/fantasy.jks"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app
          git commit -m "App Android 1.${{ github.run_number }}"
          git pull --rebase
          git push

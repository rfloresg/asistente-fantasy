name: Espía de la liga

on:
  schedule:
    # Cada 30 min de 07:00 a 01:00 (hora de Madrid en invierno = UTC+1).
    # Cada run gasta ~1 min de los 2.000 gratis al mes de GitHub.
    - cron: "*/30 6-23 * * *"
    - cron: "0 0 * * *"
    # Resumen diario a las 09:00 de Madrid (y después tu plan)
    - cron: "0 8 * * *"
    # Segundo plan del día a las 18:00 de Madrid
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "eventos, resumen, plan o manana (resumen y plan)"
        default: "eventos"

# Una pasada cada vez: la sesión de LaLiga se renueva en cada uso y dos a la vez la romperían
concurrency:
  group: laliga-session
  cancel-in-progress: false

jobs:
  espia:
    # Con el disparador externo (cron-job.org, a su hora) activado, las pasadas programadas de GitHub,
    # que llegan con horas de retraso, no hacen nada. Variable del repositorio CRON_EXTERNO = 1
    if: github.event_name != 'schedule' || vars.CRON_EXTERNO != '1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SESSION_KEY: ${{ secrets.SESSION_KEY }}
      ESPIA_LIGAS: ${{ secrets.ESPIA_LIGAS }}
      ESPIA_DINERO: ${{ vars.ESPIA_DINERO || secrets.ESPIA_DINERO }}
      ESPIA_SUBIDAS: ${{ vars.ESPIA_SUBIDAS || secrets.ESPIA_SUBIDAS }}
      ESPIA_PLAN_CHAT: ${{ secrets.ESPIA_PLAN_CHAT }}
      LIGA_ID: ${{ secrets.LIGA_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Avisos al móvil (opcionales: sin ellas no se mandan)
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
      APP_URL: ${{ vars.APP_URL || 'https://asistente-fantasy.vercel.app' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # node_modules guardado entre pasadas: se ahorra ~40 s de instalación
      - uses: actions/cache@v4
        id: deps
        with:
          path: node_modules
          key: deps-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
      - if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --omit=optional
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Resumen diario
        if: github.event.schedule == '0 8 * * *' || github.event.inputs.modo == 'resumen' || github.event.inputs.modo == 'manana'
        run: npm run espia resumen
      - name: Plan del día (privado)
        if: github.event.schedule == '0 8 * * *' || github.event.schedule == '0 17 * * *' || github.event.inputs.modo == 'plan' || github.event.inputs.modo == 'manana'
        run: npm run espia plan
      - name: Avisos de actividad
        if: github.event.schedule != '0 8 * * *' && github.event.schedule != '0 17 * * *' && github.event.inputs.modo != 'resumen' && github.event.inputs.modo != 'plan' && github.event.inputs.modo != 'manana'
        run: npm run espia

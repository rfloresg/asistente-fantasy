<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="58%" r="70%">
      <stop offset="0" stop-color="#0F3D25"/>
      <stop offset=".55" stop-color="#08190F"/>
      <stop offset="1" stop-color="#050806"/>
    </radialGradient>
    <radialGradient id="foco" cx="50%" cy="0%" r="60%">
      <stop offset="0" stop-color="#FFFFF0" stop-opacity=".16"/>
      <stop offset="1" stop-color="#FFFFF0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD966"/>
      <stop offset="1" stop-color="#F0B414"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowGold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#foco)"/>
  <g stroke="#3DEB8C" stroke-width="9" fill="none" filter="url(#glow)" opacity=".9">
    <line x1="0" y1="256" x2="512" y2="256"/>
    <circle cx="256" cy="256" r="104"/>
  </g>
  <g transform="rotate(-9 256 256)" filter="url(#glowGold)">
    <rect x="196" y="166" width="120" height="172" rx="16" fill="url(#card)"/>
  </g>
</svg>
